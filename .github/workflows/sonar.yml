name: SonarCloud analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  sonar:
    name: Sonar scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # SonarCloud needs the full history for SCM attribution (blame,
          # new-code periods). Shallow clones degrade the analysis.
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build
      - name: Coverage (core, lcov for SonarCloud)
        run: pnpm --filter @vaultkeepr/core exec vitest run --coverage
      - name: Coverage (alias, lcov for SonarCloud)
        run: pnpm --filter @vaultkeepr/alias exec vitest run --coverage
      - name: Coverage (cloud, lcov for SonarCloud)
        run: pnpm --filter @vaultkeepr/cloud exec vitest run --coverage
      - name: Coverage (smart-account, lcov for SonarCloud)
        run: pnpm --filter @vaultkeepr/smart-account exec vitest run --coverage
      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.javascript.lcov.reportPaths=packages/core/coverage/lcov.info,packages/alias/coverage/lcov.info,packages/cloud/coverage/lcov.info,packages/smart-account/coverage/lcov.info