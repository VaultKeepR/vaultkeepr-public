name: DCO check

on:
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  dco:
    name: DCO (Signed-off-by)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify Signed-off-by on every commit
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.sha }}"
          echo "Checking commits ${BASE}..${HEAD}"
          missing=0
          for sha in $(git rev-list "${BASE}..${HEAD}"); do
            if [ -z "$(git log -1 --format='%(trailers:key=Signed-off-by,valueonly)' "$sha" | tr -d '[:space:]')" ]; then
              echo "::error::Commit $sha is missing the Signed-off-by trailer (DCO)."
              echo "Rebase with sign-off: git rebase main --exec 'git commit --amend --no-edit -s'"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
          echo "All commits carry a Signed-off-by trailer (DCO)."
