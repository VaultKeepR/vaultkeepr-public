name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Workspace packages published to the npm registry (@vaultkeepr scope).
  # Excludes alias (private), cloud and ocr-native (app-level, no npm payload).
  PUBLISH_PACKAGES: "core i18n ipfs legacy logger premium recovery sentry smart-account sync ui wallet-messages"

jobs:
  pack-validate:
    name: Validate npm packagability
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build
      - name: Dry-run publish every workspace package
        run: |
          set -e
          for pkg in $PUBLISH_PACKAGES; do
            echo "::group::npm publish --dry-run @vaultkeepr/$pkg"
            (cd "packages/$pkg" && pnpm publish --dry-run --no-git-checks --access public)
            echo "::endgroup::"
          done

  publish:
    name: Publish to npm
    if: startsWith(github.ref, 'refs/tags/v')
    needs: pack-validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build
      - name: Publish workspace packages to npmjs.org
        run: |
          set -e
          for pkg in $PUBLISH_PACKAGES; do
            name="@vaultkeepr/$pkg"
            # Per-package version: reading only core's version made the skip-check
            # probe <pkg>@<core-version>, so packages still on an older local
            # version were "not found" on the registry and re-published → E403.
            VERSION=$(node -p "require('./packages/$pkg/package.json').version")
            if npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "$name@$VERSION already on npmjs.org — skipping"
            else
              (cd "packages/$pkg" && pnpm publish --no-git-checks --access public)
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # GitHub Packages mirror removed 2026-09-16: it never had working auth
      # (GITHUB_TOKEN scope does not resolve for the @vaultkeepr scope mapping),
      # every tagged run failed ENEEDAUTH on this step, and nothing consumes
      # npm.pkg.github.com for this scope. npmjs.org is the single source.
