# SonarCloud configuration (CI-based analysis via .github/workflows/sonar.yml)
sonar.projectKey=VaultKeepR_vaultkeepr-public
sonar.organization=vaultkeepr

# Vendored third-party code (Foundry submodules) is not VaultKeepR code:
# it is maintained and audited upstream (forge-std, OpenZeppelin). Scanning it
# as first-party collapsed the Security rating to D on 2026-09-22 (28/42
# issues lived in contracts/lib/** while the first-party code rated A).
sonar.exclusions=contracts/lib/**,packages/*/dist/**,packages/*/coverage/**
sonar.cpd.exclusions=contracts/lib/**
sonar.coverage.exclusions=packages/*/tests/**,packages/**/test/**,contracts/lib/**,packages/ui/**,packages/core/scripts/**,**/vitest.config.ts
# - ui: presentational React components with no unit-test infrastructure
#   (no vitest setup); excluded from line-coverage accounting until tests exist.
# - core/scripts: build-time tooling (golden-vector generator), not product code.
# - vitest.config.ts: test-runner configuration, not source to be covered.
#   (2026-09-30, keeps new_coverage meaningful on the reliability-fix PR.)

# Colocated test files are tests, not first-party code (otherwise they count
# as uncovered new code and break the "coverage on new code" quality gate).
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts

# Documented false positives (triage 2026-09-23, code read by the maintainer):
# - S2068 generate-golden-vector.mjs: the "password" strings are fixed inputs
#   for deterministic crypto test vectors ("Fixed inputs - no randomness").
# - S2068 i18n/fr.ts: a UI label string ("Mot de passe maître"), not a secret.
# - S2245 vault.ts: Math.random() builds a folder display id, no secret use.
# Header line REQUIRED: it declares which criteria are active (without it,
# every e1..eN entry below is silently ignored).
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6,e7,e8,e9
sonar.issue.ignore.multicriteria.e1.ruleKey=javascript:S2068
sonar.issue.ignore.multicriteria.e1.resourceKey=**/generate-golden-vector.mjs
sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S2068
sonar.issue.ignore.multicriteria.e2.resourceKey=**/i18n/src/fr.ts
sonar.issue.ignore.multicriteria.e3.ruleKey=typescript:S2245
sonar.issue.ignore.multicriteria.e3.resourceKey=packages/core/src/vault.ts
# S5443 logsafe.ts: the /tmp log-write risk is ADDRESSED IN CODE, not a false
# positive — openSync uses numeric O_NOFOLLOW|O_CREAT|O_APPEND with mode 0600
# and drops the write on ELOOP (planted symlink). The analyzer cannot verify
# open-flag semantics; the behavior is unit-tested (planted-symlink test in
# logsafe.test.ts). Ignoring here so the resolved finding does not count
# against the new-code security rating.
sonar.issue.ignore.multicriteria.e4.ruleKey=typescript:S5443
sonar.issue.ignore.multicriteria.e4.resourceKey=**/logsafe.ts
# S8569 ocr-native/android: structural false positive — this is a Expo module
# FRAGMENT (no standalone gradlew/settings; depends on project(':expo-modules-core')
# from the host app). Dependency resolution and its verification process belong
# to the integrating host app, as for every Expo native module; direct versions
# are already pinned (mlkit text-recognition 16.0.1, no dynamic "+"). A
# verification-metadata.xml can only be generated by a real Gradle build with
# the host app, not for the fragment in isolation.
sonar.issue.ignore.multicriteria.e5.ruleKey=text:S8569
sonar.issue.ignore.multicriteria.e5.resourceKey=packages/ocr-native/android/**
# S7503 import.ts (encryptPgpContent, decryptPgpContent, importVaultText):
# the async signatures are INTENTIONAL — the public SDK contract returns
# Promises so consumers can await uniformly, while the Argon2id WASM provider
# (setArgon2Provider) is synchronous today. Bodies are sync by design; no
# runtime defect (43 core test files green). Dropping async would change the
# published d.ts for a lint cosmetic; revisit if an async provider ships.
sonar.issue.ignore.multicriteria.e6.ruleKey=typescript:S7503
sonar.issue.ignore.multicriteria.e6.resourceKey=packages/core/src/import.ts
# S7503 vault.ts / slm-engine.ts / cloud-sharing.ts (triage 2026-09-30): same
# pattern as e6 — the async signatures are the intentional public SDK API
# (consumers await uniformly; the published d.ts declares Promise<...>) over
# synchronous internals: updateEntryUseCount is a pure map/copy, the
# VaultKeepR_SLM engine's categorizeEntries/summarizeBreach run a local sync
# engine, and createCloudShare delegates to the synchronous
# createSecureShare. Dropping async would change the published d.ts for a
# lint cosmetic; revisit if an async provider ships.
sonar.issue.ignore.multicriteria.e7.ruleKey=typescript:S7503
sonar.issue.ignore.multicriteria.e7.resourceKey=packages/core/src/vault.ts
sonar.issue.ignore.multicriteria.e8.ruleKey=typescript:S7503
sonar.issue.ignore.multicriteria.e8.resourceKey=packages/core/src/slm-engine.ts
sonar.issue.ignore.multicriteria.e9.ruleKey=typescript:S7503
sonar.issue.ignore.multicriteria.e9.resourceKey=packages/cloud/src/cloud-sharing.ts