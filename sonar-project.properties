# SonarCloud configuration (CI-based analysis via .github/workflows/sonar.yml)
sonar.projectKey=VaultKeepR_vaultkeepr-public
sonar.organization=vaultkeepr

# Vendored third-party code (Foundry submodules) is not VaultKeepR code:
# it is maintained and audited upstream (forge-std, OpenZeppelin). Scanning it
# as first-party collapsed the Security rating to D on 2026-09-22 (28/42
# issues lived in contracts/lib/** while the first-party code rated A).
sonar.exclusions=contracts/lib/**,packages/*/dist/**,packages/*/coverage/**
sonar.cpd.exclusions=contracts/lib/**
sonar.coverage.exclusions=packages/*/tests/**,packages/**/test/**,contracts/lib/**